name: Refresh prices

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run update-prices

      - run: npm run analyze
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - run: npm run build

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/prices.json src/data/releases.json src/data/insights.json src/data/digest.json
          git diff --cached --quiet && echo "No changes today" || git commit -m "chore: refresh prices and picks"

      - run: git push
